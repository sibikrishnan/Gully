services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gully-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gully_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gully_password}
      POSTGRES_DB: ${DB_NAME:-gully_dev}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gully-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gully_user} -d ${DB_NAME:-gully_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gully-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - gully-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Optional - Database GUI)
  # Uncomment if you want a web-based DB admin tool
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: gully-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@gully.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_LISTEN_PORT: 5050
  #   ports:
  #     - "5050:5050"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   networks:
  #     - gully-network
  #   depends_on:
  #     - postgres

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # pgadmin_data:
  #   driver: local

# Custom network
networks:
  gully-network:
    driver: bridge
