  Scaling & Performance Recommendations

  Database Optimizations

  1. Add Composite Indexes

  Current: Single-column indexes
  Recommended:
  // For user search queries (sport + location + 
  skill_level):
  table.index(['sport_name', 'skill_level',
  'user_id'],
    'idx_user_sports_search');

  // For pagination queries:
  table.index(['created_at', 'id'],
  'idx_users_pagination');

  Impact: 3-5x faster search queries

  2. Implement Read Replicas (Phase 3)

  // Separate read/write connections:
  const writeDb = knex(config);
  const readDb = knex({ ...config, connection:
  REPLICA_URL });

  // User search (read-heavy) → readDb
  // User update (write) → writeDb

  Trigger: >1000 concurrent users

  3. Add Database Query Caching

  // File: 
  services/backend/src/shared/cache/query-cache.ts
  export async function cachedQuery<T>(
    key: string, 
    queryFn: () => Promise<T>,
    ttlSeconds: number = 300
  ): Promise<T> {
    const cached = await redisClient.get(key);
    if (cached) return JSON.parse(cached);

    const result = await queryFn();
    await redisClient.setex(key, ttlSeconds,
  JSON.stringify(result));
    return result;
  }

  // Usage:
  const user = await cachedQuery(
    `user:${id}`,
    () => userRepository.findById(id),
    600 // 10 minutes
  );

  Impact: 10x reduction in DB load for read-heavy
  endpoints

  API Performance

  4. Implement Response Compression

  import compression from 'compression';

  app.use(compression({
    filter: (req, res) => {
      if (req.headers['x-no-compression']) return
  false;
      return compression.filter(req, res);
    },
    level: 6, // Balance speed vs size
  }));

  Impact: 60-80% bandwidth reduction

  5. Add Response Caching Headers

  // For public user profiles:
  res.set('Cache-Control', 'public, max-age=300');
  // 5 minutes

  // For authenticated user data:
  res.set('Cache-Control', 'private, max-age=60');
  // 1 minute

  // For frequently changing data:
  res.set('Cache-Control', 'no-cache'); // 
  Revalidate each time

  6. Implement Pagination Cursor-Based (Not Offset)

  Current: Offset-based pagination (LIMIT/OFFSET)
  Problem: Slow for large offsets, inconsistent
  results during updates

  Recommended:
  // Cursor-based pagination using created_at + id:
  interface PaginationCursor {
    created_at: string;
    id: number;
  }

  async function getUsersAfter(cursor?: 
  PaginationCursor, limit = 20) {
    let query = db('users').limit(limit).orderBy([
      { column: 'created_at', order: 'desc' },
      { column: 'id', order: 'desc' },
    ]);

    if (cursor) {
      query = query.where(function() {
        this.where('created_at', '<',
  cursor.created_at)
          .orWhere(function() {
            this.where('created_at', '=',
  cursor.created_at)
              .where('id', '<', cursor.id);
          });
      });
    }

    return query;
  }

  Benefits:
  - Constant time performance (O(1) vs O(n))
  - Consistent results during concurrent writes
  - Scales to millions of records

  Load Balancing & Horizontal Scaling

  7. Prepare for Stateless Architecture

  Current: In-memory rate limiting (stateful)
  Required for scaling:
  - Move all state to Redis (sessions, rate limits,
  cache)
  - Enable running multiple backend instances behind
   load balancer
  - Session affinity NOT required

  Checklist:
  - JWT-based auth (stateless) ✅
  - Redis-based rate limiting ❌
  - Redis-based session storage ❌
  - No in-memory caches ❌

