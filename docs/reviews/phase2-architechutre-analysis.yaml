  ---
  Migration Considerations

  Strengths of Current Migration Path

  ✅ Phase 1 → Phase 2 → Phase 3 approach is sound
  - Documented in docs/context/arch/migration.md
  - Clear trigger points (1K, 10K, 100K users)
  - Realistic effort estimates (2-3 dev cycles for
  Phase 2)

  ✅ Service boundaries already defined
  - Clean separation enables extraction
  - No cross-service direct DB access (enforced by
  structure)

  Migration Friction Points

  1. Shared Database Schema

  Current: All services share same database
  connection
  Problem: Extracting services to separate databases
   requires:
  - Event-driven communication (Kafka/RabbitMQ)
  - Data denormalization
  - Eventual consistency handling

  Recommended Pattern:
  // Introduce database-per-service pattern EARLY
  // Even in monolith, each service uses separate 
  schema:

  // User Service → 'user_schema' 
  // Team Service → 'team_schema'
  // Match Service → 'match_schema'

  // PostgreSQL supports schemas natively:
  CREATE SCHEMA user_schema;
  CREATE SCHEMA team_schema;

  // Later migration: Each schema → separate 
  database

  Benefits:
  - Easier to extract to separate databases
  - Prevents cross-service SQL joins NOW
  - Forces proper service communication patterns

  2. Missing Inter-Service Communication Contracts

  Problem: No defined contracts for
  service-to-service calls

  Recommendation: Use OpenAPI/Swagger NOW
  # File: services/user-service/openapi.yaml
  openapi: 3.0.0
  paths:
    /users/{id}:
      get:
        operationId: getUserById
        parameters:
          - name: id
            schema: {type: integer}
        responses:
          200:
            content:
              application/json:
                schema: {$ref:
  '#/components/schemas/User'}

  Benefits:
  - Auto-generate TypeScript clients for service
  calls
  - Contract testing between services
  - Easier migration to HTTP-based microservices

  3. Authentication/Authorization Strategy

  Current: JWT validated in each request
  Problem: Shared secret model doesn't scale to
  microservices

  Recommended Migration Path:
  Phase 1 (Current): Shared JWT secret
  Phase 2: API Gateway validates JWT, passes user
  context in headers
  Phase 3: OAuth2/OIDC with dedicated auth service
  (Keycloak, etc.)

